name: ci

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  # Vet, lint, build and test, then tag a release candidate on trunk: the
  # shared workflow the other repos call, as letsgo's own CI does.
  #
  # The page's JavaScript tests run inside `go test` (main_test.go), so they
  # gate tagging alongside the Go ones.
  ci:
    uses: danielriddell21/github-actions/.github/workflows/ci.yaml@v2
    permissions:
      contents: read
    with:
      vet: true

      # The dashboard publishes an image, so trunk tags a release candidate
      # and promote.yml publishes the stable version when the pre-release
      # checkbox is unticked on GitHub.
      pre: true

      # No .gremlins.yaml yet.
      mutate: false

      # Off until CODECOV_TOKEN is set on this repository.
      coverage: false
    secrets:
      # A tag pushed with the workflow token starts no workflow, so
      # release.yml would never fire. A token of its own does.
      tag-token: ${{ secrets.TAG_TOKEN }}
